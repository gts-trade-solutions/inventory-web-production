# nginx site for the inventory app.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/inventory
#   sudo ln -s /etc/nginx/sites-available/inventory /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default      # or it wins on port 80
#   sudo nginx -t && sudo systemctl reload nginx
#
# PLACEHOLDERS: replace inventory.example.com throughout. Run certbot AFTER the
# port-80 block below is live — it needs to answer a challenge over HTTP to
# issue the certificate, and it will rewrite the 443 block itself.
#
#   sudo certbot --nginx -d inventory.example.com

# Must match PORT in ecosystem.config.cjs. Disagree and every request is a 502
# with "connect() failed (111: Connection refused)" in the error log.
upstream inventory_app {
    server 127.0.0.1:3012;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name inventory.example.com;

    # certbot's challenge is served from here; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name inventory.example.com;

    # certbot fills these in. Left as placeholders so `nginx -t` fails loudly
    # rather than starting without TLS.
    ssl_certificate     /etc/letsencrypt/live/inventory.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventory.example.com/privkey.pem;

    # A handheld on warehouse wifi reconnects constantly; session reuse saves a
    # full handshake on each one.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # CSV import and label batches. Next's own body limit applies separately;
    # this only stops nginx rejecting first with a 413 that never reaches the app.
    client_max_body_size 20m;

    access_log /var/log/nginx/inventory.access.log;
    error_log  /var/log/nginx/inventory.error.log;

    # -----------------------------------------------------------------------
    # Server-sent events. This block is the one that is not optional.
    # -----------------------------------------------------------------------
    #
    # With default buffering, nginx holds the event stream in memory waiting for
    # a response body that never ends. The device console connects successfully,
    # reports no error, and shows nothing — OPERATIONS.md §8 lists this exact
    # symptom because it has already been diagnosed the hard way once.
    #
    location /api/v1/stream {
        proxy_pass http://inventory_app;
        proxy_http_version 1.1;

        proxy_buffering off;          # the whole point of this block
        proxy_cache off;
        gzip off;                     # compression buffers, which defeats the above

        # An idle stream is normal, not a hung request. The 60s default closes a
        # console that is simply watching a quiet warehouse.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        # SSE needs a plain persistent connection, not an upgrade.
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Immutable build output, safe to cache hard — the filenames carry hashes.
    location /_next/static/ {
        proxy_pass http://inventory_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://inventory_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Auth.js builds callback URLs from the scheme it is told. Without this
        # header it sees plain http behind the proxy and issues http callbacks,
        # which then fail against the https AUTH_URL. AUTH_TRUST_HOST=true in
        # .env is the other half of this.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
